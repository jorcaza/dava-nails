<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios - NailStudio</title>

  <link rel="stylesheet" href="css/reservar-cita.css">
  <link rel="stylesheet" href="css/servicios.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>

<body>

<header class="site-header">
  <a class="brand" href="dashboard.html">
    <i class="fa fa-spa"></i> NailStudio
  </a>

  <button onclick="window.location.href='dashboard.html'" class="btn-back">
    <i class="fa fa-arrow-left"></i> Volver
  </button>
</header>

<div class="hero">
  <span class="hero-eyebrow">Servicios</span>
  <h1>Administrar servicios</h1>
</div>

<div class="form-card">

  <!-- BUSCADOR DE SERVICIOS -->
  <div class="field field-search">
    <label>Buscar servicios</label>
    <input id="servicioSearch" type="search" placeholder="Buscar por nombre...">
  </div>

  <!-- LISTA (MISMO GRID QUE RESERVAS) -->
  <div class="service-grid" id="serviciosList"></div>

  <!-- FORMULARIO -->
  <div  >

    <div class="panel-title">Crear / Editar servicio</div>

    <div class="field">
      <label>Nombre</label>
      <input id="nombre">
    </div>

    <div class="field">
      <label>Precio</label>
      <input id="precio" type="number">
    </div>

    <div class="field">
      <label>Duración</label>
      <input id="duracion" type="number">
    </div>

    <div class="field">
      <label>Icono</label>
      <input id="icono" placeholder="fa-hand-sparkles">
      <div id="iconResults"></div>
      <div id="previewIcon"></div>
    </div>

    <div class="btn-row">
      <button id="btnGuardar" class="btn-next">
        <i class="fa fa-save"></i> Guardar
      </button>
      <button id="btnNuevo" class="btn-secondary" type="button" onclick="window.nuevoServicio()">
        <i class="fa fa-plus"></i> Nuevo servicio
      </button>
    </div>

  </div>

</div>

<script type="module" src="js/servicios.js"></script>

</body>
</html>
