      <span class="nav-label">Cerrar sesión</span>
    </a>

  </div>

</aside>

<script>
function enviarWhatsApp(cliente, hora, servicio, manicurista, telefono) {

  const mensaje = `💅 CONFIRMACIÓN DE CITA DAVANAILS

Hola ${cliente} 👋

📅 Hora: ${hora}
💅 Servicio: ${servicio}
👩‍🎨 Manicurista: ${manicurista}

✅ Por favor responde:
• CONFIRMO ✔️
• CANCELO ❌`;

  const url = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(mensaje);

  window.open(url, "_blank");
}

</script>
