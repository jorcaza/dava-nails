<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NailStudio ? Iniciar sesión</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

<!-- CONTENIDO (sin cambios visuales importantes) -->
<div class="panel-right">

  <div class="right-header">
    <h1>Bienvenida de nuevo ??</h1>
    <p>Ingresa tus credenciales para acceder al panel.</p>
  </div>

  <!-- EMAIL -->
  <div class="field">
    <label>Correo electrónico</label>
    <div class="input-wrap">
      <input type="email" id="email" placeholder="admin@nailstudio.co" autocomplete="email">
      <i class="fa fa-envelope"></i>
    </div>
    <div class="field-error" id="err-email" style="display:none;">
      Ingresa un correo válido.
    </div>
  </div>

  <!-- PASSWORD -->
  <div class="field">
    <label>Contraseña</label>

    <div class="input-wrap">
      <input type="password" id="password" placeholder="????????" autocomplete="current-password">
      
      <i class="fa fa-lock"></i>

      <!-- OJO CORREGIDO -->
      <button class="pw-toggle" type="button" id="togglePassword" tabindex="-1">
        <i class="fa fa-eye" id="pwIcon"></i>
      </button>
    </div>

    <!-- ERROR CONTROLADO DESDE JS -->
    <div class="field-error" id="err-pw" style="display:none;"></div>
  </div>

  <!-- BOTÓN -->
  <button class="btn-login" id="btnLogin">
    <span class="btn-text">
      <i class="fa fa-arrow-right-to-bracket"></i> Iniciar sesión
    </span>
    <div class="btn-spinner"></div>
  </button>

</div>

<!-- SOLO UN SCRIPT (modular) -->
<script type="module" src="/js/login.js"></script>

</body>
</html>
